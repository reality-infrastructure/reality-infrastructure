name: allocator
role: specialist
version: 1.0.0
model:
  provider: local
  name: allocator-v1
  system_prompt_file: prompts/system.md
  max_tokens: 4000
grounding:
  sources:
    - { kind: table, ref: candidates }
tools: []
memory:
  working: { max_tokens: 50000 }
  long_term: null
  compaction: null
loop:
  max_iterations: 2
  search_width: 1
  stop_when: verifier_certified
safeguards:
  output_schema: output.schema.json
  guardrails: [schema_valid, no_invented_keys, citations_resolve, no_fabrication, bounded_size, cited_values_match]
  verifier: _reference.knapsack_feasible
  confidence_field: confidence
metrics:
  items_evaluated_field: items
