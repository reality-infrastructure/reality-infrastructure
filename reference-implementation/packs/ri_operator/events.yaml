# Every command in this pack ends in exactly one of these events.  The engine adds
# ri_operator.verdict, ri_operator.correction, ri_operator.command_blocked,
# ri_operator.latency_breach and compaction.summary.  A figure nobody measured is
# written as the string UNKNOWN; it is never left out and never estimated.
events:
  ri_operator.constraint_named:
    description: "/ri-bottleneck finished: the one binding constraint of a system, the measurement that named it, and the verified change in throughput."
    payload:
      type: object
      additionalProperties: false
      required: [system, state, unit_of_flow, throughput_command, throughput_before, throughput_after, constraint, constraint_class, prediction, prediction_held, action, result, next_binding, parking_lot, unknowns]
      properties:
        system: { type: string, minLength: 1 }
        state: { type: string, enum: [DARK, DEAD, GATED, STARVED, SATURATED, THRASHING, SLOW-BUT-HEALTHY, UNSCOPED] }
        unit_of_flow: { type: string, minLength: 1 }
        throughput_command: { type: string, minLength: 1 }
        throughput_before: { type: string, minLength: 1 }
        throughput_after: { type: string, minLength: 1 }
        constraint: { type: string, minLength: 1 }
        constraint_class: { type: string, enum: [capacity, latency, serialisation, queue, rework, starvation, cadence, policy, knowledge, gate, UNKNOWN] }
        prediction: { type: string, minLength: 1 }
        prediction_held: { type: string, enum: ["yes", "no", "not-tested"] }
        action: { type: string, minLength: 1 }
        result: { type: string, minLength: 1 }
        next_binding: { type: string, minLength: 1 }
        parking_lot: { type: array, items: { type: string } }
        unknowns: { type: array, items: { type: string } }
  ri_operator.judgment_run:
    description: "/ri-judgment finished: the eight steps on one decision, whether the disproving fact was looked for, and the outcome."
    payload:
      type: object
      additionalProperties: false
      required: [decision, disproving_fact, looked, independent_root, ruin_reachable, load_bearing_assumption, who_profits, probability, best_alternative, reversible_part, irreversible_part, hot, outcome]
      properties:
        decision: { type: string, minLength: 1 }
        disproving_fact: { type: string, minLength: 1 }
        looked: { type: boolean }
        independent_root: { type: string, minLength: 1 }
        ruin_reachable: { type: boolean }
        load_bearing_assumption: { type: string, minLength: 1 }
        who_profits: { type: string, minLength: 1 }
        probability: { type: string, minLength: 1 }
        best_alternative: { type: string, minLength: 1 }
        reversible_part: { type: string, minLength: 1 }
        irreversible_part: { type: string, minLength: 1 }
        hot: { type: boolean }
        outcome: { type: string, enum: [PROCEED, PROCEED-REVERSIBLE-PART, GATED, DEFER, STOP] }
  ri_operator.gate_requested:
    description: "/ri-gate opened: the author of an action states it and every assumption it rests on, before anyone tries to disprove it."
    payload:
      type: object
      additionalProperties: false
      required: [action, author, assumptions, evidence_roots, urgency]
      properties:
        action: { type: string, minLength: 1 }
        author: { type: string, minLength: 1 }
        assumptions:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [statement, status, evidence, load_bearing]
            properties:
              statement: { type: string, minLength: 1 }
              status: { type: string, enum: [VERIFIED, BELIEF] }
              evidence: { type: string }
              load_bearing: { type: boolean }
        evidence_roots: { type: array, items: { type: string } }
        urgency: { type: string, enum: [stated, inferred, none] }
  ri_operator.gate_verdict:
    description: "/ri-gate closed: a disprover that did not write the action rules on it.  Any verdict is a successful run."
    payload:
      type: object
      additionalProperties: false
      required: [request_event_id, verdict, failed_checks, top_failure_mode, reversal_trigger, de_risking_move, run_by]
      properties:
        request_event_id: { type: string, minLength: 1 }
        verdict: { type: string, enum: [PROCEED, VERIFY-FIRST, RESTRUCTURE, HOLD] }
        failed_checks: { type: array, items: { type: string, enum: [G1, G2, G3, G4, G5, G6, G7, G8] } }
        top_failure_mode: { type: string, minLength: 1 }
        reversal_trigger: { type: string, minLength: 1 }
        de_risking_move: { type: string, minLength: 1 }
        run_by: { type: string, minLength: 1 }
  ri_operator.evidence_submitted:
    description: "/ri-evidence: one sourced excerpt for one hypothesis of one claim.  It carries no conclusion; the engine combines evidence into a belief."
    payload:
      type: object
      additionalProperties: false
      required: [claim_id, hypothesis, source_url, source_tier, ep_type, quote, observed_date, published_date, derived_from, source_id, note]
      properties:
        claim_id: { type: string, minLength: 1 }
        hypothesis: { type: string, minLength: 1 }
        source_url: { type: string, minLength: 1 }
        source_tier: { type: string, enum: [PRIMARY, SECONDARY, TERTIARY] }
        ep_type: { type: string, enum: [statutory_registry, third_party_attested, self_asserted, cryptographically_signed] }
        quote: { type: string, minLength: 1, maxLength: 600 }
        observed_date: { type: string, minLength: 10, maxLength: 10 }
        published_date: { type: [string, "null"] }
        derived_from: { type: [string, "null"] }
        source_id: { type: string, minLength: 1 }
        note: { type: string }
  ri_operator.fetch_logged:
    description: "/ri-evidence: one attempt to open a source, whatever came back.  A source that could not be read was not read."
    payload:
      type: object
      additionalProperties: false
      required: [claim_id, url, outcome]
      properties:
        claim_id: { type: string, minLength: 1 }
        url: { type: string, minLength: 1 }
        outcome: { type: string, enum: [ok, refused, timeout, unparsed, not-found, error] }
  ri_operator.scan_recorded:
    description: "/ri-scan finished: exactly one binding constraint, the count behind it, the score of the previous scan, one move, and a prediction that resolves on a date."
    payload:
      type: object
      additionalProperties: false
      required: [system, mode, output_unit, baseline, previous_scan, previous_outcome, constraint, owner, count_command, count_result, comfortable_candidate, why_not_comfortable, owner_pending, test, price, exploit, subordinate, next_constraint, prediction, prediction_resolves_on, move, stop_doing, attention, unknowns]
      properties:
        system: { type: string, minLength: 1 }
        mode: { type: string, enum: [DEEP, STANDARD] }
        output_unit: { type: string, minLength: 1 }
        baseline: { type: string, enum: [reproduced, not-reproduced, no-baseline] }
        previous_scan: { type: [string, "null"] }
        previous_outcome: { type: string, enum: [held, failed, unresolved, none] }
        constraint: { type: string, minLength: 1 }
        owner: { type: string, enum: [SELF, DEPENDENT, STRUCTURAL] }
        count_command: { type: string, minLength: 1 }
        count_result: { type: string, minLength: 1 }
        comfortable_candidate: { type: string, minLength: 1 }
        why_not_comfortable: { type: string, minLength: 1 }
        owner_pending: { type: string, minLength: 1 }
        test: { type: string, minLength: 1 }
        price: { type: string, minLength: 1 }
        exploit: { type: string, minLength: 1 }
        subordinate: { type: string, minLength: 1 }
        next_constraint: { type: string, minLength: 1 }
        prediction: { type: string, minLength: 1 }
        prediction_resolves_on: { type: string, minLength: 10, maxLength: 10 }
        move: { type: string, minLength: 1 }
        stop_doing: { type: string, minLength: 1 }
        attention: { type: string, minLength: 1 }
        unknowns: { type: array, items: { type: string } }
  ri_operator.move_graded:
    description: "/ri-week: one move a scan wrote, and whether there is evidence it happened.  No evidence is N."
    payload:
      type: object
      additionalProperties: false
      required: [scan_event_id, executed, evidence, waited_on]
      properties:
        scan_event_id: { type: string, minLength: 1 }
        executed: { type: string, enum: ["Y", "N"] }
        evidence: { type: string, minLength: 1 }
        waited_on: { type: string, minLength: 1 }
  ri_operator.week_reviewed:
    description: "/ri-week finished: the week counted from the ledger, the three named things, and the one bet."
    payload:
      type: object
      additionalProperties: false
      required: [week, scans, moves_written, moves_executed, repeater, miss, loop, prior_repeater_open, bet]
      properties:
        week: { type: string, minLength: 8, maxLength: 8 }
        scans: { type: integer, minimum: 0 }
        moves_written: { type: integer, minimum: 0 }
        moves_executed: { type: integer, minimum: 0 }
        repeater: { type: string, minLength: 1 }
        miss: { type: string, minLength: 1 }
        loop: { type: string, minLength: 1 }
        prior_repeater_open: { type: string, enum: ["yes", "no", "no-prior-week"] }
        bet: { type: string, minLength: 1 }
  ri_operator.watch_set:
    description: "/ri-week: one blind spot with a tripwire that can be observed before the damage.  At most five a week; none is carried a third week."
    payload:
      type: object
      additionalProperties: false
      required: [week, blind_spot, found_by, tripwire, tripwire_source, mark, action, whose_hand, weeks_carried, basis]
      properties:
        week: { type: string, minLength: 8, maxLength: 8 }
        blind_spot: { type: string, minLength: 1 }
        found_by: { type: string, enum: [premortem, dependency, cascade, clock, whisper, unpriced-branch, unseen-fact] }
        tripwire: { type: [string, "null"] }
        tripwire_source: { type: [string, "null"] }
        mark: { type: string, enum: [ACT, MONITOR] }
        action: { type: string, minLength: 1 }
        whose_hand: { type: string, minLength: 1 }
        weeks_carried: { type: integer, minimum: 0, maximum: 2 }
        basis: { type: string, enum: [evidence, speculation] }
  ri_operator.clock_set:
    description: "/ri-week: something with a date that nothing else is watching, or the closing of one."
    payload:
      type: object
      additionalProperties: false
      required: [what, due, source, status]
      properties:
        what: { type: string, minLength: 1 }
        due: { type: string, minLength: 10, maxLength: 10 }
        source: { type: string, minLength: 1 }
        status: { type: string, enum: [open, closed] }
  ri_operator.belief_stated:
    description: "/ri-foresight: one version of one belief the forecasts rest on.  A later version carries the lesson that caused it."
    payload:
      type: object
      additionalProperties: false
      required: [key, version, statement, because, confidence, lesson, forced, force_evidence]
      properties:
        key: { type: string, minLength: 1 }
        version: { type: integer, minimum: 1 }
        statement: { type: string, minLength: 1 }
        because: { type: string, minLength: 1 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        lesson: { type: string }
        forced: { type: boolean }
        force_evidence: { type: [string, "null"] }
  ri_operator.forecast_written:
    description: "/ri-foresight: one forecast of one metric over one window, an interval or a probability, written before the window opened unless marked as hindsight."
    payload:
      type: object
      additionalProperties: false
      required: [fid, sheet, subject, author, metric, window_start, window_end, lo, mid, hi, p, op, x, beliefs, why, premortem, hindsight]
      properties:
        fid: { type: string, minLength: 1 }
        sheet: { type: string, minLength: 1 }
        subject: { type: string, minLength: 1 }
        author: { type: string, minLength: 1 }
        metric: { type: string, minLength: 1 }
        window_start: { type: string, minLength: 20 }
        window_end: { type: string, minLength: 20 }
        lo: { type: [number, "null"] }
        mid: { type: [number, "null"] }
        hi: { type: [number, "null"] }
        p: { type: [number, "null"] }
        op: { type: [string, "null"] }
        x: { type: [number, "null"] }
        beliefs: { type: array, items: { type: string } }
        why: { type: string }
        premortem: { type: string }
        hindsight: { type: boolean }
  ri_operator.forecast_settled:
    description: "/ri-foresight: what the metric turned out to be, where the number was read, and the score that follows from it."
    payload:
      type: object
      additionalProperties: false
      required: [fid, actual, evidence, held, error, bias, interval_score, event, brier]
      properties:
        fid: { type: string, minLength: 1 }
        actual: { type: number }
        evidence: { type: string, minLength: 1 }
        held: { type: [boolean, "null"] }
        error: { type: [number, "null"] }
        bias: { type: [number, "null"] }
        interval_score: { type: [number, "null"] }
        event: { type: [number, "null"] }
        brier: { type: [number, "null"] }
  ri_operator.sheet_reviewed:
    description: "/ri-foresight: one cause for a scored sheet and the lesson that changes a number next time.  A sheet where everything held is variance."
    payload:
      type: object
      additionalProperties: false
      required: [sheet, cause, lesson, outside, forced, force_evidence]
      properties:
        sheet: { type: string, minLength: 1 }
        cause: { type: string, enum: [variance, model, overfit, execution, ops, regime, data] }
        lesson: { type: string, minLength: 1 }
        outside: { type: array, items: { type: string } }
        forced: { type: boolean }
        force_evidence: { type: [string, "null"] }
