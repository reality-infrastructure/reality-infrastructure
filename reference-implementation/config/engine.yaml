# Engine-level knobs that are not agent behavior.
loop:
  max_tool_calls_per_candidate: 24
  default_max_iterations: 3
  default_search_width: 1
export:
  min_verdicted_runs: 500
  # Whether a judge agent's verdict counts toward the gate and into the dataset
  # (operator decision 2026-10-17: the loop closes itself; a human verdict still
  # outranks an agent's on the same run).
  accept_agent_verdicts: true
autoloop:
  max_runs_per_cycle: 20        # the planner's batch is capped here, whatever it proposes
  refine_rungs: [1, 2]          # the refiner may touch grounding and harness text only
  # The loop's law (operator, 2026-10-17: "make sure the RSI performs exactly how explained in the interviews"):
  holdout: true                 # Schulman: an edit is adopted only if eval/holdout.jsonl (never tuned on) does not fall either
  kill:                         # Musk: drastic action when success leaves the set of outcomes
    window_runs: 20             #   over the agent's last N runs
    min_runs: 5                 #   once it has at least this many
    min_pass_rate: 0.5          #   below this pass rate the agent is halted: not planned, reported, until it recovers
  judge:                        # Brown: the grader is checked, and a grader that is being gamed stops counting
    min_compared: 5             #   once the operator has overridden or confirmed this many agent verdicts
    max_disagreement: 0.25      #   above this disagreement rate the judge is suspended (no agent verdicts recorded)
  grow_golden: true             # the panel: runs the operator marked followed become golden cases (never the judge's own)
sweep:                          # Brown: one continuous parallel grading loop; cost is the only reason to stop
  workers: 8                    # provider calls in flight at once; the store and the ledger stay serialized
  budget_usd: null              # null = no budget: the sweep runs until every row is graded or the kill rule halts the agent
  kill_check_every: 20          # completions between kill-rule checks
citations:
  # ref format: <kind>:<table_or_path>:<id>
  kinds: [event, table, file, run]
