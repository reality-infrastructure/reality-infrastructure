# Descriptions and argument schemas for the engine's generic tools and the
# synthetic submit tool.  These are the only model-facing strings the engine
# owns; they are data, not Python.
engine.submit:
  description: >-
    Submit the final output for this run. The input must satisfy the output
    schema exactly. Call this once, when the work is finished. Any figure that
    the schema marks as traceable must carry a citation to the source row it
    was read from.
events.query:
  description: >-
    Query the append-only event log. Returns events newest first, each with its
    event_id, entity_type, entity_id, event_type, payload, source and observed_at.
    Cite an event as event:events:<event_id>.
  input_schema:
    type: object
    additionalProperties: false
    properties:
      entity_type: { type: string }
      entity_id: { type: string }
      event_type: { type: string }
      since: { type: string, description: ISO-8601 lower bound on observed_at }
      limit: { type: integer, minimum: 1, maximum: 500, default: 50 }
events.append:
  description: >-
    Append one event to the event log. The event_type must be declared in the
    pack's events.yaml and the payload must satisfy its schema. Events are never
    edited; a correction is a new event.
  input_schema:
    type: object
    additionalProperties: false
    required: [entity_type, entity_id, event_type, payload]
    properties:
      entity_type: { type: string }
      entity_id: { type: string }
      event_type: { type: string }
      payload: { type: object }
      observed_at: { type: string }
agent_output.read:
  description: >-
    Read the certified output of a prior agent run by run_id. Figures from it
    are cited as run:agent_runs:<run_id> with the field path.
  input_schema:
    type: object
    additionalProperties: false
    required: [run_id]
    properties:
      run_id: { type: string }
agent_run.read:
  description: >-
    Read one prior run of this pack in full for adjudication: its input, status,
    output, failure reasons, model, and a compact trace of every iteration
    (tool calls, failed guardrails, verifier result, which candidate was
    accepted). A failed run cannot be cited; state its run_id in your output.
  input_schema:
    type: object
    additionalProperties: false
    required: [run_id]
    properties:
      run_id: { type: string }
runs.list:
  description: >-
    List prior runs of this pack, newest last: run_id, agent, status, input,
    the verdict in force and who recorded it. Filter by agent, status or
    whether a verdict exists.
  input_schema:
    type: object
    additionalProperties: false
    properties:
      agent: { type: string }
      status: { type: string }
      verdicted: { type: boolean }
      limit: { type: integer, minimum: 1, maximum: 500, default: 50 }
files.read:
  description: Read a text file the agent is granted. Cite as file:<path>:<line>.
  input_schema:
    type: object
    additionalProperties: false
    required: [path]
    properties:
      path: { type: string }
tables.read:
  description: >-
    Read rows from a pack table. Each row carries an id; cite a row as
    table:<table>:<id>.
  input_schema:
    type: object
    additionalProperties: false
    required: [table]
    properties:
      table: { type: string }
      row_id: { type: string }
      limit: { type: integer, minimum: 1, maximum: 5000, default: 1000 }
# JH-C11 wpH — the run loop's own tools
engine.clarify:
  description: >-
    Return a question to the agent that called you instead of guessing. Use it
    only when the input does not let you finish the work; the run ends with
    status needs_clarification and your question goes back to the caller.
  input_schema:
    type: object
    additionalProperties: false
    required: [question]
    properties:
      question: { type: string, minLength: 1, maxLength: 2000 }
siblings.message:
  description: >-
    Send a short message to the sibling runs of your fan-out group: one part by
    its index, or "*" for every sibling. It reaches the recipient at its next
    turn. Messages are recorded and your budget of them is small.
  input_schema:
    type: object
    additionalProperties: false
    required: [to, text]
    properties:
      to: { type: string, description: 'a sibling part index such as "1", or "*"' }
      text: { type: string, minLength: 1, maxLength: 2000 }
notes.write:
  description: >-
    Keep a working note (cases ruled out, partial findings). If this attempt is
    rejected, your notes come back to you in the next iteration's feedback.
  input_schema:
    type: object
    additionalProperties: false
    required: [text]
    properties:
      text: { type: string, minLength: 1, maxLength: 2000 }
scratch.write:
  description: >-
    Share a finding with the other workers of this sweep or fan-out. It is
    published only if your output is accepted; later workers see it in their
    context.
  input_schema:
    type: object
    additionalProperties: false
    required: [text]
    properties:
      text: { type: string, minLength: 1, maxLength: 4000 }
scratch.read:
  description: >-
    Read the findings other workers of this sweep or fan-out have shared so
    far, oldest first. Cite one as event:events:<event_id>.
  input_schema:
    type: object
    additionalProperties: false
    properties: {}
reasoning.read:
  description: >-
    Read the reasoning text a model produced while making one run of this pack,
    with the run's agent, status and output. For a monitor only: reasoning is
    read to see what metrics miss, and is never graded.
  input_schema:
    type: object
    additionalProperties: false
    required: [run_id]
    properties:
      run_id: { type: string }
